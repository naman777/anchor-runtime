[project]
name = "anchor-runtime"
version = "0.1.0"
description = "A workflow engine for versioned agent workflows"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.16,<2",
    "fastapi>=0.115,<1",
    "openai>=2,<3",
    "psycopg[binary]>=3.2,<4",
    "pydantic>=2.12,<3",
    "sqlalchemy>=2.0,<2.1",
    "uvicorn>=0.34,<1",
]

[dependency-groups]
dev = ["httpx2>=2,<3", "pytest>=9,<10", "ruff>=0.14,<1"]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/anchor_runtime"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["postgres: requires ANCHOR_TEST_DATABASE_URL"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
